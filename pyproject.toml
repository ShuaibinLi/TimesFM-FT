[project]
name = "timesfm-ft"
version = "0.1.0"
description = "TimesFM 3 research toolkit for dynamic-context 1-minute intraday returns."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fsspec>=2025.9",
  "gcsfs>=2025.9",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pyarrow>=14",
  "torch>=2.1",
  "huggingface-hub>=0.28",
  "safetensors>=0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]
baselines = [
  "lightgbm>=4.5",
]

[project.scripts]
timesfm-ft = "timesfm_ft.cli:main"
timesfm-eval = "timesfm_ft.eval_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
